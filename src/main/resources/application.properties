spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS}

app.upload.dir=${APP_UPLOAD_DIR}
app.public-url=${APP_PUBLIC_URL:}
app.gemini.api-key=${APP_GEMINI_API_KEY}
app.gemini.model=${APP_GEMINI_MODEL}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,https://ai-powered-blog-application-frontend-nwovw4lp8.vercel.app}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}
